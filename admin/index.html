<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Portal | Jennings County News</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Georgia', serif; background-color: #fcfcfc; color: #121212; line-height: 1.6; padding: 0 15px 40px; }

        .utility-bar { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; padding: 8px 0; border-bottom: 1px solid #121212; text-transform: uppercase; }
        .back-link { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-decoration: none; color: #121212; text-transform: uppercase; }
        .back-link:hover { color: #b20000; }

        header { max-width: 900px; margin: 0 auto; text-align: center; padding: 15px 0 10px; border-bottom: 3px double #121212; }
        .masthead-title { font-size: 36px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; font-family: 'Times New Roman', serif; text-decoration: none; color: #121212; }

        article { max-width: 750px; margin: 30px auto; padding-bottom: 40px; border-bottom: 1px solid #121212; }
        
        .admin-control-bar { max-width: 750px; margin: 20px auto; background: #f0f0f0; border: 1px solid #121212; padding: 15px; font-family: Arial, sans-serif; font-size: 12px; }
        .admin-control-bar label { font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .admin-control-bar select, .admin-control-bar input[type="file"] { margin-bottom: 15px; font-size: 12px; }

        .edit-category { width: 100%; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; color: #b20000; text-transform: uppercase; margin-bottom: 8px; border: 1px dashed #bbb; padding: 4px; background: transparent; }
        .edit-headline { width: 100%; font-family: 'Georgia', serif; font-size: 38px; line-height: 1.15; font-weight: bold; margin-bottom: 12px; border: 1px dashed #bbb; padding: 4px; background: transparent; }
        .edit-subheadline { width: 100%; font-family: 'Georgia', serif; font-size: 18px; color: #444; font-style: italic; margin-bottom: 15px; border: 1px dashed #bbb; padding: 4px; background: transparent; }
        
        .byline-bar { font-family: Arial, sans-serif; font-size: 11px; color: #666; text-transform: uppercase; padding: 8px 0; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .edit-byline { font-family: Arial, sans-serif; font-size: 11px; border: 1px dashed #bbb; padding: 2px 5px; text-transform: uppercase; }

        .article-image { margin-bottom: 25px; text-align: center; }
        .article-image img { width: 100%; max-height: 450px; object-fit: cover; border: 1px solid #ddd; display: none; }
        .photo-placeholder { background: #eee; height: 250px; display: flex; align-items: center; justify-content: center; color: #777; font-family: Arial, sans-serif; font-size: 12px; border: 1px dashed #aaa; }
        .edit-caption { width: 100%; font-family: Arial, sans-serif; font-size: 11px; color: #555; margin-top: 5px; border: 1px dashed #bbb; padding: 4px; background: transparent; }

        .edit-body { width: 100%; min-height: 250px; font-family: 'Georgia', serif; font-size: 17px; line-height: 1.6; color: #1a1a1a; padding: 10px; border: 1px dashed #bbb; background: transparent; }

        .action-bar { max-width: 750px; margin: 20px auto; text-align: center; }
        .btn-action { background: #121212; color: #fff; border: none; padding: 12px 24px; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
        .btn-action:hover { background: #b20000; }

        footer { max-width: 900px; margin: 30px auto 0; text-align: center; font-family: Arial, sans-serif; font-size: 11px; color: #666; }
    </style>
</head>
<body>

    <div class="utility-bar">
        <a href="../index.html" class="back-link">&larr; Return to Front Page</a>
        <div>EDITOR PORTAL</div>
    </div>

    <header>
        <a href="../index.html" class="masthead-title">Jennings County News</a>
    </header>

    <div class="admin-control-bar">
        <label for="visibility-select">Article Visibility:</label>
        <select id="visibility-select">
            <option value="true">Public (Visible to everyone)</option>
            <option value="false">Private (Hidden from public)</option>
        </select>

        <label for="image-input">Upload Story Image:</label>
        <input type="file" id="image-input" accept="image/*" onchange="previewUploadedImage(event)">
    </div>

    <article>
        <input type="text" id="cat-field" class="edit-category" value="JENNINGS COUNTY • PUBLIC SAFETY">
        <input type="text" id="title-field" class="edit-headline" value="Headline of the Article Goes Here">
        <input type="text" id="sub-field" class="edit-subheadline" value="An optional subheadline or quick summary of the news story goes here.">
        
        <div class="byline-bar">
            <div>BY <input type="text" id="author-field" class="edit-byline" value="Staff Reporter"></div>
            <div>PUBLISHED: <span id="current-date">August 30, 2026</span></div>
        </div>

        <div class="article-image">
            <div id="photo-box" class="photo-placeholder">[ Upload photo above to embed image ]</div>
            <img id="image-preview" src="" alt="Story Image">
            <input type="text" id="caption-field" class="edit-caption" value="Caption explaining the photo and crediting the photographer.">
        </div>

        <textarea id="body-field" class="edit-body" placeholder="Write story paragraphs here...">NORTH VERNON — The opening paragraph of your article goes here.

Second paragraph goes here. Add details, quotes, and background information regarding the event or notice.

Third paragraph with additional context and closing statements.</textarea>
    </article>

    <div class="action-bar">
        <button class="btn-action" onclick="generateAndDownloadHTML()">Download Article File (.html)</button>
    </div>

    <footer>
        &copy; 2026 Jennings County News Editor System.
    </footer>

    <script>
        let uploadedImageBase64 = "";

        function previewUploadedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    const img = document.getElementById('image-preview');
                    const box = document.getElementById('photo-box');
                    img.src = uploadedImageBase64;
                    img.style.display = 'block';
                    box.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function generateAndDownloadHTML() {
            const isPublic = document.getElementById('visibility-select').value;
            const category = document.getElementById('cat-field').value;
            const title = document.getElementById('title-field').value;
            const subtitle = document.getElementById('sub-field').value;
            const author = document.getElementById('author-field').value;
            const caption = document.getElementById('caption-field').value;
            
            const rawBody = document.getElementById('body-field').value;
            const paragraphs = rawBody.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('\n            ');

            let imageHTML = `<div style="background:#eee; height:250px; display:flex; align-items:center; justify-content:center; color:#777; font-family:Arial; font-size:12px;">[ Main Story Photo ]</div>`;
            if (uploadedImageBase64) {
                imageHTML = `<img src="${uploadedImageBase64}" alt="${title}">`;
            }

            const fullPageHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} | Jennings County News</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Georgia', serif; background-color: #fcfcfc; color: #121212; line-height: 1.6; padding: 0 15px; }

        .utility-bar { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; padding: 8px 0; border-bottom: 1px solid #121212; text-transform: uppercase; }
        .back-link { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-decoration: none; color: #121212; text-transform: uppercase; }
        .back-link:hover { color: #b20000; }

        header { max-width: 900px; margin: 0 auto; text-align: center; padding: 15px 0 10px; border-bottom: 3px double #121212; }
        .masthead-title { font-size: 36px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; font-family: 'Times New Roman', serif; text-decoration: none; color: #121212; }

        article { max-width: 750px; margin: 30px auto; padding-bottom: 40px; border-bottom: 1px solid #121212; }
        
        .category { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; color: #b20000; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        h1.article-headline { font-size: 38px; line-height: 1.15; font-weight: bold; margin-bottom: 12px; }
        .subheadline { font-size: 18px; color: #444; line-height: 1.3; margin-bottom: 15px; font-style: italic; }
        
        .byline-bar { font-family: Arial, sans-serif; font-size: 11px; color: #666; text-transform: uppercase; padding: 8px 0; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; margin-bottom: 25px; display: flex; justify-content: space-between; }
        
        .article-image { margin-bottom: 25px; }
        .article-image img { width: 100%; height: auto; border: 1px solid #ddd; }
        .image-caption { font-family: Arial, sans-serif; font-size: 11px; color: #555; margin-top: 5px; }

        .article-body p { font-size: 17px; margin-bottom: 18px; color: #1a1a1a; text-align: justify; }
        .article-body p:first-of-type::first-letter { font-size: 42px; float: left; line-height: 0.8; padding-right: 8px; font-weight: bold; font-family: 'Times New Roman', serif; }

        .access-denied { max-width: 600px; margin: 80px auto; text-align: center; font-family: Arial, sans-serif; display: none; }
        .access-denied h2 { font-size: 28px; margin-bottom: 10px; color: #b20000; }
        .access-denied p { font-size: 14px; color: #555; margin-bottom: 20px; }

        footer { max-width: 900px; margin: 0 auto 30px; text-align: center; font-family: Arial, sans-serif; font-size: 11px; color: #666; }
        footer a { color: inherit; text-decoration: none; }
    </style>
</head>
<body>

    <script>
        const IS_PUBLIC = ${isPublic};
    <\/script>

    <div id="article-content">
        <div class="utility-bar">
            <a href="../index.html" class="back-link">&larr; Return to Front Page</a>
            <div>JENNINGS COUNTY NEWS</div>
        </div>

        <header>
            <a href="../index.html" class="masthead-title">Jennings County News</a>
        </header>

        <article>
            <div class="category">${category}</div>
            <h1 class="article-headline">${title}</h1>
            <div class="subheadline">${subtitle}</div>
            
            <div class="byline-bar">
                <div>By <strong>${author}</strong></div>
                <div>Published: August 30, 2026</div>
            </div>

            <div class="article-image">
                ${imageHTML}
                <div class="image-caption">${caption}</div>
            </div>

            <div class="article-body">
                ${paragraphs}
            </div>
        </article>

        <footer>
            <div><a href="../index.html">Front Page</a> &bull; <a href="../admin/index.html">Editor Portal</a></div>
            <div style="margin-top: 8px;">&copy; 2026 Jennings County News. All rights reserved.</div>
        </footer>
    </div>

    <div id="private-notice" class="access-denied">
        <h2>403 — Private Article</h2>
        <p>This news article is currently private or unpublished.</p>
        <a href="../index.html" style="color:#121212; font-weight:bold;">&larr; Return to Homepage</a>
    </div>

    <script>
        if (!IS_PUBLIC) {
            document.getElementById('article-content').style.display = 'none';
            document.getElementById('private-notice').style.display = 'block';
        }
    <\/script>

</body>
</html>`;

            const filename = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '.html';
            const blob = new Blob([fullPageHTML], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
    </script>

</body>
</html>
