backend:
  name: github
  repo: Jennings-County-News/jenningscountynews
  branch: main
  base_url: https://sstatic.net
  auth_endpoint: /auth/github

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "County/Category", name: "category", widget: "select", options: ["Jennings County", "Bartholomew County", "Jackson County", "Sports", "Public Safety"]}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Body Text", name: "body", widget: "markdown"}
