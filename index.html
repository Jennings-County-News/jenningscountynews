<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jennings County News</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-muted: #555555;
            --border-color: #dddddd;
            --accent-color: #b20000;
            --header-bg: #121212;
            --header-text: #ffffff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaa;
            --border-color: #333333;
            --accent-color: #ff4d4d;
            --header-bg: #000000;
            --header-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s; }
        body { font-family: 'Georgia', serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }

        /* Header & Masthead */
        header { background-color: var(--header-bg); color: var(--header-text); text-align: center; padding: 30px 20px 20px; border-bottom: 4px solid var(--accent-color); }
        .masthead-title { font-size: 38px; text-transform: uppercase; letter-spacing: -1px; font-weight: bold; }
        .masthead-sub { font-family: Arial, sans-serif; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; color: #ccc; }

        /* Navigation Bar */
        nav { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 10px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
        .nav-categories { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; text-transform: uppercase; background: none; border: 1px solid var(--border-color); padding: 6px 12px; cursor: pointer; color: var(--text-color); border-radius: 3px; }
        .nav-btn.active, .nav-btn:hover { background-color: var(--accent-color); color: #fff; border-color: var(--accent-color); }

        /* Controls: Search & Dark Mode */
        .controls { display: flex; gap: 10px; align-items: center; margin-top: 10px; width: 100%; max-width: 1000px; padding: 0 20px; margin: 15px auto 0; }
        .search-box { flex-grow: 1; padding: 8px 12px; font-size: 14px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--card-bg); color: var(--text-color); font-family: Arial, sans-serif; }
        .theme-toggle { font-family: Arial, sans-serif; font-size: 12px; padding: 8px 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); cursor: pointer; border-radius: 4px; font-weight: bold; }

        /* Main Layout */
        main { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .section-header { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-transform: uppercase; border-bottom: 2px solid var(--text-color); padding-bottom: 5px; margin-bottom: 20px; letter-spacing: 1px; }

        /* Article Grid */
        .article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .article-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: var(--text-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .article-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .article-cat { font-family: Arial, sans-serif; font-size: 10px; font-weight: bold; color: var(--accent-color); text-transform: uppercase; margin-bottom: 8px; }
        .article-title { font-size: 20px; margin-bottom: 10px; line-height: 1.3; }
        .article-date { font-family: Arial, sans-serif; font-size: 11px; color: var(--text-muted); margin-top: auto; }

        #no-results { display: none; font-family: Arial, sans-serif; font-size: 14px; color: var(--text-muted); text-align: center; padding: 40px 0; }
        
        footer { text-align: center; padding: 30px 20px; font-family: Arial, sans-serif; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-color); margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <div class="masthead-title">Jennings County News</div>
        <div class="masthead-sub">Local News &bull; Public Safety &bull; High School Sports</div>
    </header>

    <div class="controls">
        <input type="text" id="search-input" class="search-box" placeholder="Search news stories..." oninput="filterArticles()">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Toggle Theme</button>
    </div>

    <nav>
        <div class="nav-categories">
            <button class="nav-btn active" onclick="filterCategory('all', this)">All Stories</button>
            <button class="nav-btn" onclick="filterCategory('Jennings County', this)">Jennings County</button>
            <button class="nav-btn" onclick="filterCategory('Bartholomew County', this)">Bartholomew County</button>
            <button class="nav-btn" onclick="filterCategory('Jackson County', this)">Jackson County</button>
            <button class="nav-btn" onclick="filterCategory('Public Safety', this)">Public Safety</button>
            <button class="nav-btn" onclick="filterCategory('Sports', this)">Sports</button>
        </div>
    </nav>

    <main>
        <div class="section-header" id="current-category-label">Latest Headliness</div>
        
        <div id="article-grid" class="article-grid">
            <!-- Articles will automatically populate here from GitHub -->
        </div>

        <div id="no-results">No news stories found matching your criteria.</div>
    </main>

    <footer>
        &copy; 2026 Jennings County News. Published via GitHub Pages. | <a href="admin/index.html" style="color: inherit;">Editor Portal</a>
    </footer>

    <script>
        const REPO_OWNER = "Jennings-County-News";
        const REPO_NAME = "jenningscountynews";
        let articlesData = [];
        let activeCategory = 'all';

        // Fetch published articles automatically from GitHub API
        async function loadArticles() {
            const grid = document.getElementById("article-grid");
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/articles`);
                if (!response.ok) throw new Error("No articles folder found yet.");
                
                const files = await response.json();
                const htmlFiles = files.filter(f => f.name.endsWith('.html') || f.name.endsWith('.md'));

                if (htmlFiles.length === 0) {
                    document.getElementById("no-results").style.display = "block";
                    return;
                }

                articlesData = htmlFiles.map(file => {
                    const nameWithoutExt = file.name.replace(/\.(html|md)$/, '');
                    const titleFormatted = nameWithoutExt.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/-/g, ' ');
                    
                    return {
                        filename: file.name,
                        path: file.path,
                        title: titleFormatted.charAt(0).toUpperCase() + titleFormatted.slice(1),
                        category: file.name.toLowerCase().includes('sports') ? 'Sports' : 
                                  file.name.toLowerCase().includes('safety') ? 'Public Safety' : 'Jennings County',
                        url: `articles/${file.name}`
                    };
                });

                renderArticles();
            } catch (err) {
                grid.innerHTML = `<p style="font-family:Arial; font-size:14px; color:#888;">No published articles found in <code>articles/</code> folder yet.</p>`;
            }
        }

        function renderArticles() {
            const grid = document.getElementById("article-grid");
            const search = document.getElementById("search-input").value.toLowerCase();
            grid.innerHTML = "";

            const filtered = articlesData.filter(art => {
                const matchesCat = activeCategory === 'all' || art.category === activeCategory;
                const matchesSearch = art.title.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                document.getElementById("no-results").style.display = "block";
            } else {
                document.getElementById("no-results").style.display = "none";
                filtered.forEach(art => {
                    const card = document.createElement("a");
                    card.className = "article-card";
                    card.href = art.url;
                    card.innerHTML = `
                        <div>
                            <div class="article-cat">${art.category}</div>
                            <div class="article-title">${art.title}</div>
                        </div>
                        <div class="article-date">Read Story &rarr;</div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById("current-category-label").textContent = cat === 'all' ? 'Latest Headlines' : cat;
            renderArticles();
        }

        function filterArticles() {
            renderArticles();
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }

        // Preserve dark mode preference
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
        }

        loadArticles();
    </script>
</body>
</html>
